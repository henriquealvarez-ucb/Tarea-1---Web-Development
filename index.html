<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <header>
            <div class="login-logo">
                <img src="img/icons/logo.png" alt="" aria-hidden="true">
            </div>
            <h1>Club de Fronton</h1>
            <p>Sistema de gestion de jugadores y partidos</p>
        </header>

        <form action="dashboard.html" method="get">
            <fieldset>
                <legend>Iniciar sesión</legend>

                <div class="form-group">
                    <label for="usuario">Usuario o correo</label>
                    <input type="text" id="usuario" name="usuario" placeholder="jugador@clubfronton.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </fieldset>

            <div class="form-options">
                <label for="recordar">
                    <input type="checkbox" name="recordar" id="recordar">
                    Recordarme
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
        </form>

        <footer>
            <p>&copy; 2026 Club de Frontón. Todos los derechos reservados.</p>
        </footer>
    </main>
    
</body>
</html>
