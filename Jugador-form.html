<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar jugador - Club de Frontón</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo"><img src="img/icons/logo.png" alt="" aria-hidden="true"></span>
        <span>
          Club de Frontón
        </span>
      </div>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="dashboard.html"><img class="icon icon-light" src="img/icons/dashboard.png" alt="" aria-hidden="true"> Panel principal</a></li>
          <li><a href="jugadores.html" aria-current="page"><img class="icon icon-light" src="img/icons/group.png" alt="" aria-hidden="true"> Jugadores</a></li>
          <li><a href="partidos.html"><img class="icon icon-light" src="img/icons/raquet.png" alt="" aria-hidden="true"> Partidos</a></li>
        </ul>
      </nav>
      <div class="logout">
        <a href="index.html">Cerrar sesión</a>
      </div>
    </aside>

    <main class="content form-page">
      <div class="page-header">
        <div>
          <h1>Registrar jugador</h1>
          <p>Completa los datos para dar de alta un nuevo socio</p>
        </div>
      </div>

      <form action="jugadores.html" method="get">
        <fieldset>
          <legend><img class="icon" src="img/icons/user.png" alt="" aria-hidden="true"> Datos personales</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
            </div>
            <div class="form-group">
              <label for="apellidos">Apellidos</label>
              <input type="text" id="apellidos" name="apellidos" placeholder="Pérez" required>
            </div>
            <div class="form-group">
              <label for="fecha-nacimiento">Fecha de nacimiento</label>
              <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
            </div>
            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" name="email" placeholder="jugador@clubfronton.com" required>
            </div>
            <div class="form-group">
              <label for="telefono">Teléfono</label>
              <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><img class="icon" src="img/icons/raquet.png" alt="" aria-hidden="true"> Datos deportivos</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="categoria">Categoría</label>
              <select id="categoria" name="categoria" required>
                <option value="">Selecciona una categoría</option>
                <option value="primera">Primera</option>
                <option value="segunda">Segunda</option>
                <option value="tercera">Tercera</option>
                <option value="infantil">Infantil</option>
              </select>
            </div>
            <div class="form-group">
              <label for="estado">Estado</label>
              <select id="estado" name="estado" required>
                <option value="activo">Activo</option>
                <option value="lesionado">Lesionado</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label id="mano-label">Mano dominante</label>
            <div class="radio-group" role="group" aria-labelledby="mano-label">
              <label for="mano-diestra">
                <input type="radio" id="mano-diestra" name="mano" value="diestra" checked>
                Diestra
              </label>
              <label for="mano-zurda">
                <input type="radio" id="mano-zurda" name="mano" value="zurda">
                Zurda
              </label>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Guardar jugador</button>
          <a href="jugadores.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>

      <footer>
        <p>&copy; 2026 Club de Frontón. Todos los derechos reservados.</p>
      </footer>
    </main>
  </div>
</body>
</html>
